name: Attest historical M0 nonce 22

on:
  push:
    branches: [feat/attest-nonce-22]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAINNET_RPC_URL: https://eth.drpc.org

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: crossecute/forge-attest@998d11c9325990a74c534ef406a968c509d1544a
        with:
          config: attest-nonce22.toml
          foundry-version: v1.8.1
          require-live: "true"
